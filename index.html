<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Can i take you on a date?
    </title>


    <!-- =====================================
         GOOGLE FONTS
    ====================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================
         CSS
    ====================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================
         BACKGROUND DECORATIONS
    ====================================== -->

    <div class="background">

        <div class="heart heart-1">
            💗
        </div>

        <div class="heart heart-2">
            💕
        </div>

        <div class="heart heart-3">
            💖
        </div>

        <div class="heart heart-4">
            💗
        </div>


        <div class="sparkle sparkle-1">
            ✦
        </div>

        <div class="sparkle sparkle-2">
            ✧
        </div>

        <div class="sparkle sparkle-3">
            ✦
        </div>

        <div class="sparkle sparkle-4">
            ✧
        </div>

        <div class="sparkle sparkle-5">
            ✦
        </div>


        <div class="bow">
            🎀
        </div>

    </div>



    <!-- =====================================
         MAIN CARD
    ====================================== -->

    <main
        class="card"
        id="card"
    >


        <!-- =================================
             TOP DECORATIVE CIRCLE
        ================================== -->

        <div class="circle-decoration"></div>



        <!-- =================================
             MAIN EMOJI
        ================================== -->

        <div
            class="main-emoji"
            id="mainEmoji"
        >
            🥰
        </div>



        <!-- =================================
             MAIN QUESTION
        ================================== -->

        <h1>
            Can you give me money?
        </h1>



        <!-- =================================
             DESCRIPTION
        ================================== -->

        <p class="description">

            You thought i'm asking you for a date XD.

        </p>



        <!-- =================================
             BUTTONS
        ================================== -->

        <div
            class="button-container"
            id="buttonContainer"
        >


            <!-- YES BUTTON -->

            <button
                class="yes-button"
                id="yesButton"
            >

                Of course, I'd love to! 💘

            </button>



            <!-- NO BUTTON -->

            <button
                class="no-button"
                id="noButton"
            >

                No 😅

            </button>


        </div>



        <!-- =================================
             SMALL P.S. MESSAGE
        ================================== -->

        <p
            class="small-message"
            id="smallMessage"
        >

           I know you have some money. 😉

        </p>



        <!-- =================================
             SUCCESS MESSAGE
        ================================== -->

        <div
            class="success-message"
            id="successMessage"
        >

            YAY! 💖 Thank you so much!

            <br>

            I can't wait to spend it. ✨

        </div>


    </main>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>


</body>

</html>
